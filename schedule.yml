# ╔══════════════════════════════════════════════════════════════════════╗
# ║   E5 KeepAlive 运行配置表 —— 后续维护者只改这一个文件就够了             ║
# ║   （按北京时间填写，程序自动换算 UTC、自动生成触发点）                  ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
#  修改流程：
#    1. 改下面表格对应字段
#    2. GitHub → Actions → "Rebuild Schedule" → Run workflow
#    3. 完成！1 分钟内生效
#
#  ┌──────┬──────────────┬──────────┬──────────┬──────────────────────┬──────────┐
#  │ 波次  │ 时间段(北京)  │ 计划最小值│ 计划最大值│ 当前时间段完成百分之多少 │ 跑完是否推送│
#  ├──────┼──────────────┼──────────┼──────────┼──────────────────────┼──────────┤
#  │ 第1波 │ 05:00-07:00  │ 70       │ 90       │ 30%-50%              │ 否        │
#  │ 第2波 │ 07:00-09:00  │ 70       │ 90       │ 30%-50%              │ 否        │
#  │ 第3波 │ 09:00-11:00  │ 70       │ 90       │ 100%（跑完剩余）       │ 是        │
#  └──────┴──────────────┴──────────┴──────────┴──────────────────────┴──────────┘
#
#  字段说明：
#    time     - 时间段："HH:MM-HH:MM"，24 小时制，支持跨零点（如 "23:00-01:00"）
#    plan_min - 每天每账户请求总数的【最小值】
#    plan_max - 每天每账户请求总数的【最大值】
#               每天从 plan_min~plan_max 随机抽一个作为当天总量
#               注意：这是"每天总量"，各行必须填一样的值（写在每行只为表格完整好读）
#    percent  - 本波完成【当天总量】的百分之多少："30-50"（区间随机）或 "40"（固定）
#               最后一波必须填 100（= 跑完剩余，保证每天恰好完成当天总量）
#    notify   - 本波跑完是否推送：true / false（一般只给最后一波开 true）
#
#  - 想加减波数：照格式加减 "- time: ..." 一项即可（建议 2~4 波）
#  - 每个时间段自动抽 candidate_points 个触发点，按 rotate 周期换一批
#  - E5_ACCOUNTS 里的 daily_calls 字段已失效，每天总量以本表为准

waves:
  - time: "05:00-07:00"
    plan_min: 70
    plan_max: 90
    percent: "30-50"
    notify: false
  - time: "07:00-09:00"
    plan_min: 70
    plan_max: 90
    percent: "30-50"
    notify: false
  - time: "09:00-11:00"
    plan_min: 70
    plan_max: 90
    percent: "100"
    notify: true

# 每个时间段随机抽取的触发点数量（默认 8 个）
candidate_points: 8

# 触发点多久换一批：weekly=每周换（推荐）/ monthly / daily / fixed=固定不变
rotate: weekly
