name: Rebuild Schedule

on:
  workflow_dispatch:          # 手动：改完 schedule.yml 后点一下
  schedule:
    - cron: '7 12 * * *'      # 每天 UTC 12:07（北京 20:07）重抽次日的随机时刻

permissions:
  contents: read              # 推送走 PAT（GITHUB_TOKEN 被禁止改 workflow 文件）

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 用 PAT 检出：这样后面 git push 用的也是它，
          # 才有权限修改 .github/workflows/ 下的文件（GITHUB_TOKEN 被 GitHub 禁止）
          token: ${{ secrets.REPO_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 生成 keepalive.yml
        run: python tools/build_keepalive.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/keepalive.yml
          if git diff --cached --quiet; then
            echo "触发点无变化，跳过提交"
          else
            git commit -m "chore: 更新次日随机运行时刻"
            git push
          fi
