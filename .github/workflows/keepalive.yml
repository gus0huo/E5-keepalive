name: E5 KeepAlive

on:
  workflow_dispatch:          # 手动触发（照跑 + 推送，方便测试）
  schedule:
    # ===== 上午场：北京时间 10:00-12:00（UTC 2-3 点），8 个候选触发点 =====
    - cron: '3 2 * * *'       # 北京 10:03
    - cron: '18 2 * * *'      # 北京 10:18
    - cron: '33 2 * * *'      # 北京 10:33
    - cron: '48 2 * * *'      # 北京 10:48
    - cron: '3 3 * * *'       # 北京 11:03
    - cron: '18 3 * * *'      # 北京 11:18
    - cron: '33 3 * * *'      # 北京 11:33
    - cron: '48 3 * * *'      # 北京 11:48
    # ===== 下午场：北京时间 15:00-17:00（UTC 7-8 点），8 个候选触发点 =====
    - cron: '3 7 * * *'       # 北京 15:03
    - cron: '18 7 * * *'      # 北京 15:18
    - cron: '33 7 * * *'      # 北京 15:33
    - cron: '48 7 * * *'      # 北京 15:48
    - cron: '3 8 * * *'       # 北京 16:03
    - cron: '18 8 * * *'      # 北京 16:18
    - cron: '33 8 * * *'      # 北京 16:33
    - cron: '48 8 * * *'      # 北京 16:48

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 抽签步骤：没中签的触发点在这里几秒退出，不产生实质消耗
      - name: Decide slot
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PYEOF'
          import hashlib
          import os
          from datetime import datetime, timezone

          event = os.environ.get("EVENT", "")
          schedule = os.environ.get("SCHEDULE", "")
          minutes = [3, 18, 33, 48]
          n_slots = 8

          if event != "schedule":
              # 手动触发：照跑 + 推送，方便测试
              run, notify = "true", "true"
          else:
              parts = schedule.split()
              hour, minute = int(parts[1]), int(parts[0])
              window = "am" if hour in (2, 3) else "pm"
              base = 2 if window == "am" else 7
              slot = (hour - base) * 4 + (minutes.index(minute) if minute in minutes else 0)
              date = datetime.now(timezone.utc).strftime("%Y-%m-%d")
              seed = f"e5-{date}-{window}"
              chosen = int(hashlib.sha256(seed.encode()).hexdigest(), 16) % n_slots
              run = "true" if slot == chosen else "false"
              # 只有下午场推送
              notify = "true" if window == "pm" else "false"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run={run}\nnotify={notify}\n")
          print(f"schedule={schedule!r} -> run={run} notify={notify}")
          PYEOF

      - name: Checkout
        if: steps.decide.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.decide.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.decide.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run keepalive
        if: steps.decide.outputs.run == 'true'
        env:
          # ---- E5 账户 ----
          E5_ACCOUNTS: ${{ secrets.E5_ACCOUNTS }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TARGET_USERS: ${{ vars.TARGET_USERS }}
          MIN_CALLS: ${{ vars.MIN_CALLS }}
          MAX_CALLS: ${{ vars.MAX_CALLS }}
          ENABLE_WRITES: ${{ vars.ENABLE_WRITES }}
          # ---- 通知 ----
          NOTIFY_ENABLED: ${{ steps.decide.outputs.notify }}
          NOTIFY_SERVERCHAN_KEY: ${{ secrets.NOTIFY_SERVERCHAN_KEY }}
          NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.NOTIFY_TELEGRAM_BOT_TOKEN }}
          NOTIFY_TELEGRAM_CHAT_ID: ${{ secrets.NOTIFY_TELEGRAM_CHAT_ID }}
          NOTIFY_SMTP_HOST: ${{ secrets.NOTIFY_SMTP_HOST }}
          NOTIFY_SMTP_PORT: ${{ secrets.NOTIFY_SMTP_PORT }}
          NOTIFY_SMTP_USER: ${{ secrets.NOTIFY_SMTP_USER }}
          NOTIFY_SMTP_PASS: ${{ secrets.NOTIFY_SMTP_PASS }}
          NOTIFY_SMTP_TO: ${{ secrets.NOTIFY_SMTP_TO }}
        run: python main.py
