name: E5 KeepAlive

on:
  workflow_dispatch:          # 手动触发（照跑 + 推送，方便测试）
  schedule:
    # ===== 上午场：北京时间 05:00-07:00（UTC 前一日 21-22 点），8 个候选触发点 =====
    - cron: '3 21 * * *'      # 北京 5:03
    - cron: '18 21 * * *'     # 北京 5:18
    - cron: '33 21 * * *'     # 北京 5:33
    - cron: '48 21 * * *'     # 北京 5:48
    - cron: '3 22 * * *'      # 北京 6:03
    - cron: '18 22 * * *'     # 北京 6:18
    - cron: '33 22 * * *'     # 北京 6:33
    - cron: '48 22 * * *'     # 北京 6:48
    # ===== 下午场：北京时间 10:00-12:00（UTC 2-3 点），8 个候选触发点 =====
    - cron: '3 2 * * *'       # 北京 10:03
    - cron: '18 2 * * *'      # 北京 10:18
    - cron: '33 2 * * *'      # 北京 10:33
    - cron: '48 2 * * *'      # 北京 10:48
    - cron: '3 3 * * *'       # 北京 11:03
    - cron: '18 3 * * *'      # 北京 11:18
    - cron: '33 3 * * *'      # 北京 11:33
    - cron: '48 3 * * *'      # 北京 11:48

permissions:
  contents: read

concurrency:
  group: e5-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 抽签步骤：没中签的触发点在这里几秒退出，不产生实质消耗
      - name: Decide slot
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PYEOF'
          import hashlib
          import os
          from datetime import datetime, timedelta, timezone

          event = os.environ.get("EVENT", "")
          schedule = os.environ.get("SCHEDULE", "")
          minutes = [3, 18, 33, 48]
          n_slots = 2 * len(minutes)   # 每窗 2 小时 × 每小时候选数 = 8

          if event != "schedule":
              # 手动触发：照跑 + 推送，方便测试
              run, notify, window = "true", "true", "manual"
          else:
              parts = schedule.split()
              hour, minute = int(parts[1]), int(parts[0])
              window = "am" if hour in (21, 22) else "pm"
              base = 21 if window == "am" else 2
              slot = (hour - base) * len(minutes) + (minutes.index(minute) if minute in minutes else 0)
              # 用北京日期做种子：同一北京日的两波各自抽签，且防延迟跨天抽出双黄蛋
              date = (datetime.now(timezone.utc) + timedelta(hours=8)).strftime("%Y-%m-%d")
              seed = f"e5-{date}-{window}"
              chosen = int(hashlib.sha256(seed.encode()).hexdigest(), 16) % n_slots
              run = "true" if slot == chosen else "false"
              # 只有下午场推送
              notify = "true" if window == "pm" else "false"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run={run}\nnotify={notify}\nwindow={window}\n")
          print(f"schedule={schedule!r} -> run={run} notify={notify} window={window}")
          PYEOF

      - name: Checkout
        if: steps.decide.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.decide.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.decide.outputs.run == 'true'
        run: pip install -r requirements.txt

      # 取回今天的账本（昨天的会自动作废）
      - name: Restore daily state
        if: steps.decide.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .e5_state.json
          key: e5-state-${{ github.run_id }}
          restore-keys: |
            e5-state-

      - name: Run keepalive
        if: steps.decide.outputs.run == 'true'
        env:
          # ---- 运行场次（am=上午场只跑一部分，pm/manual=跑剩余全部）----
          RUN_WINDOW: ${{ steps.decide.outputs.window }}
          # ---- E5 账户 ----
          E5_ACCOUNTS: ${{ secrets.E5_ACCOUNTS }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TARGET_USERS: ${{ vars.TARGET_USERS }}
          # ---- 预算（每账户每天请求数 / 每天跑几波）----
          DAILY_CALLS: ${{ vars.DAILY_CALLS }}
          RUNS_PER_DAY: ${{ vars.RUNS_PER_DAY }}
          MIN_CALLS: ${{ vars.MIN_CALLS }}
          MAX_CALLS: ${{ vars.MAX_CALLS }}
          ENABLE_WRITES: ${{ vars.ENABLE_WRITES }}
          # ---- 通知 ----
          NOTIFY_ENABLED: ${{ steps.decide.outputs.notify }}
          NOTIFY_SERVERCHAN_KEY: ${{ secrets.NOTIFY_SERVERCHAN_KEY }}
          NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.NOTIFY_TELEGRAM_BOT_TOKEN }}
          NOTIFY_TELEGRAM_CHAT_ID: ${{ secrets.NOTIFY_TELEGRAM_CHAT_ID }}
          NOTIFY_SMTP_HOST: ${{ secrets.NOTIFY_SMTP_HOST }}
          NOTIFY_SMTP_PORT: ${{ secrets.NOTIFY_SMTP_PORT }}
          NOTIFY_SMTP_USER: ${{ secrets.NOTIFY_SMTP_USER }}
          NOTIFY_SMTP_PASS: ${{ secrets.NOTIFY_SMTP_PASS }}
          NOTIFY_SMTP_TO: ${{ secrets.NOTIFY_SMTP_TO }}
        run: python main.py

      # 保存今天的账本（即使运行失败也保存）
      - name: Save daily state
        if: always() && steps.decide.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: .e5_state.json
          key: e5-state-${{ github.run_id }}
